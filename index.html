<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>
  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
  <script>
    window.TrackJS && TrackJS.install({ 
      token: "07ebed51efe04167b1875e84e637cf56",
      application: "randomname"
    });
  </script>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button id="consoleLog">Console Log</button>
      <button id="consoleError">Console Error</button>
      <button id="consoleCount">Console Count</button>
      <button id="consoleWarn">Console Warn</button>
      <button id="consoleAssert">Console Assert</button>
      <button id="consoleClear">Console Clear</button>
      <button id="consoleDir">Console Dir</button>
      <button id="consoleDirxml">Console dirxml</button>
      <button id="consoleGroupStart">Console Group Start</button>
      <button id="consoleGroupEnd">Console Group End</button>
      <button id="consoleTable">Console Table</button>
      <button id="consoleStartTimer">Start Timer</button>
      <button id="consoleEndTimer">End Timer</button>
      <button id="consoleTrace">Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
  </main>

  <script>
    console.log("Anlisa's email username? anl084, homework start");
    window.onerror = function(message, url, line, col, error) {
      console.group("GlobalErrorCatcher");
      console.log(`${message}\n At ${line}:${col} of ${url}`);
      console.groupEnd();
    };
    

    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');
      let firstNum = document.querySelector('#first-num').value;
      let secondNum = document.querySelector('#second-num').value;
      let operator = document.querySelector('#operator').value;
      output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    // Start your code here
    let logBtn = errorBtns[0];
    let errorBtn = errorBtns[1];
    let countBtn = errorBtns[2]; 
    //count number of times a function has been called
    let warnBtn = errorBtns[3];
    let assertBtn = errorBtns[4];
    let clearBtn = errorBtns[5];
    let dirBtn = errorBtns[6];
    let dirxmlBtn = errorBtns[7];
    //creates a group collapsible console.group(name)
    let groupStartBtn = errorBtns[8];
    //finsllay stops the group here
    let groupEndBtn = errorBtns[9];
    let tableBtn = errorBtns[10];
    let startTimerBtn = errorBtns[11];
    let endTimerBtn = errorBtns[12];
    let traceBtn = errorBtns[13];
    let globalErrorBtn = errorBtns[14];


    logBtn.addEventListener("click", ()=>{
      console.log("you clicked ont the console log button");
    });
    errorBtn.addEventListener("click", ()=>{
      console.error("you clicked ont he error button");
    });
    countBtn.addEventListener("click", ()=>{
      console.count("Button Pressed: "); 
      //buttonpressed: 1, 2, 3 etc
    });
    warnBtn.addEventListener("click", ()=>{
      console.warn("warning here")
    });
    assertBtn.addEventListener("click", ()=>{
      let a = 1;
      console.assert(a == 2, "Is a == 2");
    });
    clearBtn.addEventListener("click", ()=>{
      console.clear();
    });
    dirBtn.addEventListener("click", ()=>{
      console.dir(document.body);
    });
    dirxmlBtn.addEventListener("click", ()=>{
      console.dirxml(form);
    });
    groupStartBtn.addEventListener("click", ()=>{
      console.group("newgroupname"); 
      //name doesnt matter?
    });
    groupEndBtn.addEventListener("click", ()=>{
      console.groupEnd(); 
      //closes most recnt group
    });
    tableBtn.addEventListener("click", ()=>{
      console.table([1,2,3]);
      //array objects or an array of objects
    });
    startTimerBtn.addEventListener("click", ()=>{
      console.time("myTimer"); //can have several timers,
      // // so need same label to end it
    });
    endTimerBtn.addEventListener("click", ()=>{
      console.timeEnd("myTimer");
    });
    traceBtn.addEventListener("click",()=>{
      console.trace("trace here"); //mesage needed here, for trace btn to work
    });
    globalErrorBtn.addEventListener("click", ()=>{
      nonexistentfunction();
    });

    class DivisionError extends Error {
      constructor(message) {
        super(message); // (1)
        this.name = "DivisionError"; // (2)
      }
    }

    try{
      let a1 = 99/0;
      let b1 = 0;
      let b2 = 1;
      if(b1 == 0){
        throw new DivisionError("There cant be 0s for division");
      }
    }
    catch(error){
      console.group("ErrorHere")
      console.log(error.name, "\n", error.message);
      console.log(error.stack);
      console.log(error.cause);
      console.groupEnd();
    }
    finally{
      console.log("this runs regardless")
    }
  </script>
</body>

</html>
